# Copy this file to /etc/nginx/sites-available/playbox on your server,
# replace example.com, then enable it with a symlink in sites-enabled.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Let Nginx serve static assets directly.
    location /static/ {
        alias /var/www/playbox/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Forward requests for this Flask app to Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
